name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm test
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/http-server.js
          node --check src/tools.js
          node --check src/redmine-client.js
